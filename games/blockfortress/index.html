<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Block Fortress</title>

  <!-- These lines make it work like a real app on the iPad home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hinton-Bazil Games">
  <meta name="theme-color" content="#2a1660">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="manifest" href="../../manifest.webmanifest">

  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      color: #2b2b2b;
      background: #2d4a2f;
    }
    .hidden {
      display: none !important;
    }
    button {
      font: inherit;
      font-weight: bold;
      font-size: 20px;
      border: none;
      border-radius: 18px;
      padding: 12px 20px;
      color: white;
      background: #3d8bff;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }
    button.green { background: #2ebd6b; }
    button.orange { background: #ff8a1e; }
    button.grey { background: #8e9aa6; }
    button.blue { background: #3d8bff; }

    /* The level map */
    #mapScreen {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      touch-action: pan-y;
      background: linear-gradient(#5aa9ff, #8fd694 60%);
      padding: calc(env(safe-area-inset-top) + 16px) 24px 40px;
    }
    #mapScreen h1 {
      margin: 0 80px 6px 0;
      font-size: clamp(34px, 6vw, 56px);
      color: white;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }
    .top-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .pill {
      background: white;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 22px;
      font-weight: bold;
    }
    .map-section {
      background: rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      padding: 12px 16px 18px;
      margin-top: 16px;
    }
    .map-section h2 {
      margin: 4px 0 12px;
      color: white;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
    }
    .level-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .level {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: white;
      color: #2b2b2b;
      padding: 8px;
    }
    .level .num {
      font-size: 44px;
    }
    .level .lstars {
      font-size: 18px;
    }
    .level .crown {
      position: absolute;
      top: -14px;
      right: -8px;
      font-size: 30px;
    }
    .level.locked {
      opacity: 0.5;
    }
    .level.next {
      background: #ffd23c;
      animation: pulse 0.9s infinite alternate;
    }
    @keyframes pulse {
      to { transform: scale(1.07); }
    }
    .help {
      color: white;
      font-size: 18px;
      margin: 6px 0 0;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    /* Pop-ups */
    .popup-back {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 20, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .popup {
      background: #fffdf6;
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 92%;
      overflow-y: auto;
      touch-action: pan-y;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .popup.wide {
      max-width: 860px;
    }
    .popup h2 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #2f7a43;
    }
    .popup h3 {
      margin: 18px 0 6px;
      text-align: left;
    }
    .popup p {
      font-size: 20px;
      margin: 10px 0;
    }
    .popup .advice {
      background: #fff3c4;
      border-radius: 14px;
      padding: 10px;
    }
    .popup .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .stars {
      font-size: 56px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .card {
      background: white;
      color: #2b2b2b;
      border: 4px solid transparent;
      padding: 10px;
    }
    .card .big {
      font-size: 46px;
    }
    .card .name {
      font-size: 17px;
    }
    .card .sub {
      font-size: 15px;
      color: #9a6038;
    }
    .card.owned {
      opacity: 0.6;
    }
    .card.chosen {
      border-color: #2ebd6b;
    }
    .toast {
      position: fixed;
      left: 50%;
      top: 14%;
      transform: translateX(-50%);
      background: #2b2b2b;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 18px;
      pointer-events: none;
      text-align: center;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="mapScreen">
    <h1>🏰 Block Fortress</h1>
    <div class="top-row">
      <div id="coins" class="pill">🪙 0</div>
      <div id="badges" class="pill" title="Times you spotted if Bolt was right">🔍 0</div>
      <button id="shopButton" class="orange">🛒 Shop</button>
    </div>
    <p class="help">Build walls and towers to stop the monsters reaching your castle. Tap the glowing level to play!</p>
    <div id="levels"></div>
  </div>

  <a class="home" href="../../">🏠</a>

  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script>
    // Lets the game work offline once it's been opened.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("../../sw.js");
    }
  </script>
</body>
</html>
