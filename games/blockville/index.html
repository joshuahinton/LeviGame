<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Blockville</title>

  <!-- These lines make it work like a real app on the tablet home screen (tablet or Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hinton-Bazil Games">
  <meta name="theme-color" content="#2a1660">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="manifest" href="../../manifest.webmanifest">

  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      color: #3b2350;
    }
    .hidden {
      display: none !important;
    }

    button {
      font: inherit;
      font-weight: bold;
      font-size: 20px;
      border: none;
      border-radius: 18px;
      padding: 12px 20px;
      color: white;
      background: #3d8bff;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }
    button.pink { background: #ff5fa2; }
    button.green { background: #2ebd6b; }
    button.orange { background: #ff8a1e; }
    button.grey { background: #9a8fa8; }

    /* Coins and the pets button at the top */
    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: calc(env(safe-area-inset-left) + 12px);
      display: flex;
      gap: 10px;
    }
    #coins {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
    }

    /* Touch buttons: move on the left, jump and do things on the right */
    #controls button {
      position: fixed;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      font-size: 40px;
      padding: 0;
      background: rgba(255, 255, 255, 0.35);
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
      box-shadow: none;
      border: 4px solid rgba(255, 255, 255, 0.7);
      touch-action: none;
    }
    #controls button.down {
      background: rgba(255, 255, 255, 0.65);
      transform: scale(0.94);
    }
    #left { left: calc(env(safe-area-inset-left) + 24px); bottom: calc(env(safe-area-inset-bottom) + 24px); }
    #right { left: calc(env(safe-area-inset-left) + 136px); bottom: calc(env(safe-area-inset-bottom) + 24px); }
    #jump { right: calc(env(safe-area-inset-right) + 24px); bottom: calc(env(safe-area-inset-bottom) + 24px); }
    #controls #action {
      right: calc(env(safe-area-inset-right) + 136px);
      bottom: calc(env(safe-area-inset-bottom) + 34px);
      width: auto;
      height: 76px;
      padding: 0 24px;
      border-radius: 38px;
      font-size: 24px;
      background: #ff5fa2;
      border-color: white;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      to { transform: scale(1.06); }
    }

    /* Pop-ups */
    .popup-back {
      position: fixed;
      inset: 0;
      background: rgba(40, 15, 60, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .popup {
      background: #fff8fc;
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 92%;
      overflow-y: auto;
      touch-action: pan-y;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .popup.wide {
      max-width: 820px;
    }
    .popup h2 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #ff5fa2;
    }
    .popup h3 {
      margin: 0;
      font-size: 30px;
    }
    .popup p {
      font-size: 20px;
      margin: 10px 0;
    }
    .popup .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .big-emoji {
      font-size: 110px;
      line-height: 1.2;
    }
    .wobble {
      animation: wobble 0.35s infinite alternate ease-in-out;
    }
    @keyframes wobble {
      from { transform: rotate(-14deg); }
      to { transform: rotate(14deg) scale(1.08); }
    }
    .pop {
      animation: pop 0.6s;
    }
    @keyframes pop {
      0% { transform: scale(0.2); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .rarity {
      display: inline-block;
      color: white;
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 14px 8px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      cursor: pointer;
      border: 4px solid transparent;
    }
    .card.chosen {
      border-color: #ff5fa2;
    }
    .card .big-emoji {
      font-size: 70px;
    }
    .card .name {
      font-size: 20px;
      font-weight: bold;
    }
    .card .small {
      font-size: 14px;
      margin-top: 4px;
    }
    .card .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
      color: #e0a400;
    }
    .card .bar {
      height: 10px;
      background: #eee;
      border-radius: 5px;
      margin: 8px 10px 0;
      overflow: hidden;
    }
    .card .bar div {
      height: 100%;
      background: #2ebd6b;
    }

    /* The dressing room */
    .dressing {
      background: linear-gradient(135deg, #ffd6ec, #e7d4ff);
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
      gap: 16px;
      align-items: stretch;
    }
    .dress-left {
      width: 34%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .theme-banner {
      font-size: 28px;
      font-weight: bold;
      color: #ff5fa2;
      text-align: center;
    }
    .timer {
      position: relative;
      width: 100%;
      height: 34px;
      background: white;
      border-radius: 17px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: #2ebd6b;
      transition: width 1s linear;
    }
    .timer-fill.hurry {
      background: #e8463c;
    }
    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }
    .preview {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    .coins-line {
      font-size: 20px;
      font-weight: bold;
    }
    .dress-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      padding: 12px;
      padding-right: 70px;
      min-width: 0;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab {
      font-size: 16px;
      padding: 8px 12px;
      background: white;
      color: #3b2350;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1);
    }
    .tab.chosen {
      background: #ff5fa2;
      color: white;
    }
    .note {
      font-size: 15px;
      margin: 6px 4px 0;
      min-height: 4px;
    }
    .items {
      flex: 1;
      overflow-y: auto;
      touch-action: pan-y;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 10px;
      align-content: start;
      padding: 8px 2px;
    }
    .item {
      background: white;
      color: #3b2350;
      padding: 6px;
      font-size: 14px;
      border: 4px solid transparent;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1);
    }
    .item canvas {
      width: 84px;
      height: 84px;
      display: block;
      margin: 0 auto 2px;
    }
    .item.chosen {
      border-color: #ff5fa2;
    }
    .item.locked canvas {
      opacity: 0.5;
    }
    .colors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 8px;
    }
    .swatch {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }
    .swatch.chosen {
      border-color: #3b2350;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      background: #3b2350;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 18px;
      pointer-events: none;
      text-align: center;
      max-width: 80%;
    }

    @media (orientation: portrait) {
      .dressing {
        flex-direction: column;
      }
      .dress-left {
        width: 100%;
        height: 38%;
      }
      .dress-right {
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="coins">🪙 0</div>
    <button id="petsButton" class="pink">🐾 My Pets</button>
  </div>

  <div id="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
    <button id="action" class="hidden">Enter</button>
    <button id="jump">⬆</button>
  </div>

  <a class="home" href="../../">🏠</a>

  <script src="../../compat.js"></script>
  <script src="avatar.js"></script>
  <script src="game.js"></script>
  <script src="pets.js"></script>
  <script src="fashion.js"></script>
  <script>
    startGame();
    // Lets the game work offline once it's been opened.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("../../sw.js");
    }
  </script>
</body>
</html>
